<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remember — Smart Glasses Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  </head>
  <body>
    <div id="viewport">
      <video id="webcam" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>

    <div id="subtitles"></div>

    <div id="toast"></div>

    <div id="listening-overlay">
      <div class="pulse-ring">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V20H9v2h6v-2h-2v-2.08A7 7 0 0 0 19 11h-2z"/>
        </svg>
      </div>
    </div>

    <div id="checklist" class="hidden">
      <h3>Agenda</h3>
      <ul id="checklist-items"></ul>
    </div>

    <button id="enroll-btn">+</button>

    <div id="action-bar">
      <button id="mute-btn" aria-label="Mute"></button>
      <button id="ai-btn">Ask AI</button>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
